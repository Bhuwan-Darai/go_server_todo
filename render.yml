services:
  - type: web
    name: go-crud-app
    env: go
    runtime: image
    image:
      name: node:20
      preBuildCommands:
        - npm install -g prisma
      buildCommand: |
        go mod tidy
        prisma generate
        prisma migrate dev
        go run github.com/steebchen/prisma-client-go migrate deploy
        go run github.com/99designs/gqlgen generate
      startCommand: go run main.go
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: go-crud-app
          property: connectionString
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://your-frontend.onrender.com # Update with your frontend URL
      - key: DIRECT_URL
        fromDatabase:
          name: go-crud-app
          property: connectionString # Same as DATABASE_URL unless specified otherwise
databases:
  - name: go-crud-app
    plan: free
