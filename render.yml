services:
  - type: web
    name: go-crud-app
    env: go
    runtime: image
    image:
      name: node:20
      preBuildCommands:
        - npm install -g prisma
      buildCommand: |
        go mod tidy
        prisma generate
        prisma migrate deploy
        go run github.com/99designs/gqlgen generate
      startCommand: go run main.go
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: go-crud-app
          property: connectionString
      - key: PORT
        value: 10000
databases:
  - name: go-crud-app
    plan: free
