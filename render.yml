services:
  - type: web
    name: go-crud-app
    env: go-crud-app
    runtime: image
    git:
      depth: false
    image:
      name: golang:1.21-bullseye
      preBuildCommands:
        - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
        - apt-get update && apt-get install -y nodejs
        - npm install -g prisma
      buildCommand: |
        go mod tidy
        prisma migrate deploy
        go run github.com/99designs/gqlgen generate
      startCommand: go run main.go
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: go-crud-app
          property: connectionString
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://your-actual-frontend.onrender.com
      - key: DIRECT_URL
        fromDatabase:
          name: go-crud-app
          property: connectionString
databases:
  - name: go-crud-app
    plan: free
