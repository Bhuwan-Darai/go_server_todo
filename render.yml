services:
  - type: web
    name: go-crud-app
    env: go
    buildCommand: |
      go mod tidy
      npx prisma generate
      npx prisma migrate deploy
    startCommand: go run main.go
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: go-crud-app
          property: connectionString
databases:
  - name: go-crud-app
    plan: free
